        - paragraph [ref=e196]:
          - text: Generate videos using Google Flow AI models (
          - link "Veo 3.1 Quality" [ref=e197] [cursor=pointer]:
            - /url: https://deepmind.google/technologies/veo/
          - text: ","
          - link "Veo 3.1 Fast" [ref=e198] [cursor=pointer]:
            - /url: https://deepmind.google/technologies/veo/
          - text: ","
          - link "Veo 3.1 Fast Relaxed" [ref=e199] [cursor=pointer]:
            - /url: https://deepmind.google/technologies/veo/
          - text: ","
          - link "Veo 3.1 Lite" [ref=e200] [cursor=pointer]:
            - /url: https://deepmind.google/technologies/veo/
          - text: ) from text prompts with optional start/end frames, reference images, or voice narration. Videos are returned as signed URLs ready for download.
        - paragraph [ref=e201]:
          - text: This endpoint features dynamic concurrency management. If you receive a
          - code [ref=e202]: 429 Too Many Requests
          - text: or
          - code [ref=e203]: 503 Service Unavailable
          - text: response, simply wait 5-10 seconds before retrying—both status codes indicate temporary capacity constraints and are safe to retry. If you consistently receive 429 errors, you may need to execute a cool-off period of at least a few hours before trying again. Video generation typically completes within 60-180 seconds depending on the model and mode. The endpoint automatically polls for completion and returns the final result.
        - paragraph [ref=e204]:
          - text: Use a
          - link "Google AI Ultra" [ref=e205] [cursor=pointer]:
            - /url: https://one.google.com/ai
          - text: $125/m special subscription plan for
          - code [ref=e206]: Veo 3.1 Fast
          - text: $5cents/video and
          - code [ref=e207]: Veo 3.1 Quality
          - text: $50cents/video generations.
          - code [ref=e208]: Veo 3.1 Fast Relaxed
          - text: is available for Ultra subscribers with no credit cost but lower generation priority.
