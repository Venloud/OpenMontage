            - code [ref=e368]: veo-3.1-fast-relaxed
            - text: models.
          - listitem [ref=e369]:
            - text: •
            - code [ref=e370]: voice
            - text: is optional, voice name for AI narration in the generated video (case-insensitive). Requires at least one
            - code [ref=e371]: referenceImage
            - text: (R2V mode). Preview voice samples using the dropdown in Try It below.
            - generic [ref=e372]:
              - code [ref=e375]: "[\"achird\",\"achernar\",\"algieba\",\"algenib\",\"alnilam\",\"aoede\",\"autonoe\",\"callirrhoe\",\"charon\",\"despina\",\"enceladus\",\"erinome\",\"fenrir\",\"gacrux\",\"iapetus\",\"kore\",\"laomedeia\",\"leda\",\"orus\",\"puck\",\"pulcherrima\",\"rasalgethi\",\"sadachbia\",\"sadaltager\",\"schedar\",\"sulafat\",\"umbriel\",\"vindemiatrix\",\"zephyr\",\"zubenelgenubi\"]"
              - button "Copy code to clipboard" [ref=e376]:
                - img [ref=e377]
            - paragraph [ref=e379]:
              - text: "Voice samples:"
              - code [ref=e380]: "https://www.gstatic.com/aistudio/voices/samples/{Name}.wav"
          - listitem [ref=e381]:
            - text: •
            - code [ref=e382]: async
            - text: "is optional, enables fire-and-forget mode (default:"
            - code [ref=e383]: "false"
            - text: ). When
            - code [ref=e384]: "true"
            - text: ", returns immediately with"
            - code [ref=e385]: 201 Created
            - text: and job metadata. Poll
            - link "GET /jobs/jobId" [ref=e386] [cursor=pointer]:
              - /url: ./get-google-flow-jobs-jobid
              - text: GET /jobs/
              - code [ref=e387]: jobId
            - text: for completion status. Useful for avoiding long request timeouts since video generation takes 60-180 seconds.
          - listitem [ref=e388]:
            - text: •
            - code [ref=e389]: replyUrl
            - text: is optional, webhook URL for job status callbacks. Receives POST requests with job status updates (
            - code [ref=e390]: created
            - text: ","
            - code [ref=e391]: started
            - text: ","
            - code [ref=e392]: completed
            - text: ","
            - code [ref=e393]: failed
            - text: ). The JSON payload shape matches
            - link "GET /jobs/jobId" [ref=e394] [cursor=pointer]:
              - /url: ./get-google-flow-jobs-jobid
              - text: GET /jobs/
              - code [ref=e395]: jobId
            - text: response.
          - listitem [ref=e396]:
            - text: •
            - code [ref=e397]: replyRef
            - text: is optional, custom reference string passed back in webhook callbacks. Useful for tracking jobs on your end.
          - listitem [ref=e398]:
            - text: •
            - code [ref=e399]: captchaToken
            - text: ","
            - code [ref=e400]: captchaRetry
            - text: ","
            - code [ref=e401]: captchaOrder
            - text: are optional, mutually exclusive captcha parameters. See
            - link "Captcha Parameters" [ref=e402] [cursor=pointer]:
              - /url: ./post-google-flow-accounts-captcha-providers#captcha-parameters
            - text: for details.
